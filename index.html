<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>每日大瓜</title>
  <style>
    /* 全局样式：重置边距，占满视口，深色背景柔和 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #1e1e2f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 登录卡片 — 在移动端和PC都舒适 */
    .login-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 48px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* 标题与提示 */
    .login-title {
      color: #f0f0ff;
      font-weight: 500;
      font-size: 1.6rem;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
      text-align: center;
    }

    .login-sub {
      color: #a0aec0;
      font-size: 0.95rem;
      text-align: center;
      margin-bottom: 28px;
      opacity: 0.8;
    }

    /* 输入框组 */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-field {
      width: 100%;
      padding: 18px 20px;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 40px;
      color: #f0f0ff;
      outline: none;
      transition: border 0.25s, box-shadow 0.25s;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .input-field:focus {
      border-color: #7c8cff;
      box-shadow: 0 0 0 4px rgba(124, 140, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    .input-field::placeholder {
      color: #8892a8;
      font-weight: 300;
      letter-spacing: 0.3px;
    }

    /* 查看按钮 — 醒目且易于点击 */
    .btn-view {
      width: 100%;
      padding: 18px 20px;
      font-size: 1.2rem;
      font-weight: 600;
      background: linear-gradient(145deg, #6d7cff, #4a5bff);
      border: none;
      border-radius: 60px;
      color: white;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.25s, background 0.2s;
      letter-spacing: 0.5px;
      margin-top: 6px;
      box-shadow: 0 8px 20px rgba(74, 91, 255, 0.35);
    }

    .btn-view:active {
      transform: scale(0.96);
      background: #3a4be0;
      box-shadow: 0 4px 12px rgba(74, 91, 255, 0.5);
    }

    .btn-view:hover {
      background: #5a6cf0;
      box-shadow: 0 10px 28px rgba(74, 91, 255, 0.45);
    }

    /* 错误信息 — 温和且可见 */
    .error-message {
      color: #ff9a9e;
      background: rgba(255, 70, 70, 0.12);
      padding: 12px 16px;
      border-radius: 40px;
      font-size: 0.95rem;
      text-align: center;
      margin-top: 12px;
      border-left: 3px solid #ff6b70;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      display: none;
      transition: opacity 0.2s;
    }

    .error-message.show {
      display: block;
    }

    /* ---- 全屏图片遮罩层 (默认隐藏) ---- */
    .fullscreen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0b14; /* 深色背景，突出图片 */
      display: none;       /* 默认隐藏，JS控制显示 */
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 0;
      margin: 0;
      overflow: hidden;
      /* 优雅的淡入效果 (由JS添加类触发) */
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .fullscreen-overlay.active {
      display: flex;
      opacity: 1;
    }

    /* 图片容器 — 保证图片完全居中且适配屏幕 */
.fullscreen-image-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0b0b14;
  overflow: hidden;
}

.fullscreen-image-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: transparent;
  user-select: none;
  -webkit-user-drag: none;
  opacity: 0;
  transition: opacity 0.5s ease;
}
    .fullscreen-overlay.active .fullscreen-image-wrapper img {
      opacity: 1;
    }

    /* 关闭按钮 (全屏模式下的退出) — 精致且不干扰图片 */
    .close-fullscreen-btn {
      position: fixed;
      top: 28px;
      right: 28px;
      width: 52px;
      height: 52px;
      border-radius: 40px;
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f0f0ff;
      font-size: 28px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10001;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: background 0.2s, transform 0.15s;
      font-weight: 300;
      padding: 0;
    }

    .close-fullscreen-btn:hover {
      background: rgba(60, 60, 80, 0.85);
    }

    .close-fullscreen-btn:active {
      transform: scale(0.92);
    }

    /* 简单的手机适配优化 */
    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
        border-radius: 36px;
      }
      .login-title {
        font-size: 1.4rem;
      }
      .input-field {
        padding: 16px 18px;
        font-size: 1rem;
      }
      .btn-view {
        padding: 16px;
        font-size: 1.1rem;
      }
      .close-fullscreen-btn {
        top: 20px;
        right: 20px;
        width: 48px;
        height: 48px;
        font-size: 26px;
      }
    }

    /* 针对横屏或大屏，保持舒适 */
    @media (min-width: 1024px) {
      .login-card {
        padding: 44px 40px;
        max-width: 460px;
      }
    }

    /* 暗色滚动条美观 */
    ::-webkit-scrollbar {
      width: 6px;
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #4a5bff66;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <!-- 登录卡片 -->
  <div class="login-card" id="loginCard">
    <div class="login-title">🔐 安全查看</div>
    <div class="login-sub">输入密码 · 查看今日大瓜</div>

    <div class="input-group">
      <input type="password" id="passwordInput" class="input-field" placeholder="请输入密码" autocomplete="off" value="">
      <button class="btn-view" id="viewButton">登录</button>
    </div>

    <!-- 错误提示区域 -->
    <div id="errorMessage" class="error-message">❌ 密码错误，请重试</div>
  </div>

  <!-- 全屏遮罩层 (图片容器) -->
  <div class="fullscreen-overlay" id="fullscreenOverlay">
    <div class="fullscreen-image-wrapper" id="imageWrapper">
      <!-- 图片将被动态插入到这里 -->
      <img id="fullscreenImage" src="" alt="全屏图片" />
    </div>
    <!-- 关闭按钮（X） -->
    <button class="close-fullscreen-btn" id="closeFullscreenBtn">✕</button>
  </div>

      // ---------- DOM 元素 ----------
      const passwordInput = document.getElementById('passwordInput');
      const viewButton = document.getElementById('viewButton');
      const errorMsg = document.getElementById('errorMessage');
      const fullscreenOverlay = document.getElementById('fullscreenOverlay');
      const fullscreenImage = document.getElementById('fullscreenImage');
      const closeBtn = document.getElementById('closeFullscreenBtn');

      // ---------- 辅助函数 ----------
      // 显示错误信息 (短暂出现)
      function showError(show = true) {
        if (show) {
          errorMsg.classList.add('show');
          // 自动淡出错误 (5秒后消失)
          clearTimeout(window.errorTimer);
          window.errorTimer = setTimeout(() => {
            errorMsg.classList.remove('show');
          }, 5000);
        } else {
          errorMsg.classList.remove('show');
          clearTimeout(window.errorTimer);
        }
      }

      // 清空输入框高亮 / 错误状态 (不自动清空值)
      function clearErrorState() {
        errorMsg.classList.remove('show');
        clearTimeout(window.errorTimer);
      }

      // 进入全屏图片模式
      function enterFullscreen(imageSrc) {
        if (!imageSrc || imageSrc.trim() === '') {
          // 如果图片数据为空，给一个友好的提示 (但不阻止全屏)
          // 可以设置一个占位提示，但为了演示，我们仍然显示一个提示性图片
          // 但既然用户会填入base64，这里仅作保险
          fullscreenImage.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48cmVjdCB3aWR0aD0iODAiIGhlaWdodD0iODAiIGZpbGw9IiMxYzFjMjgiLz48dGV4dCB4PSI4IiB5PSI0NSIgZm9udC1zaXplPSIxNiIgZmlsbD0iI2FhYyIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiPuKciOivtOaYr+WbvueJh+WbvueJhzwvdGV4dD48L3N2Zz4='; 
        } else {
          fullscreenImage.src = imageSrc;
        }

        // 激活遮罩 (触发过渡)
        fullscreenOverlay.classList.add('active');
        // 防止背景滚动 (但遮罩固定，无滚动)
        document.body.style.overflow = 'hidden';
        // 手机端可能还需要锁定触摸
        document.body.style.touchAction = 'none';
      }

      // 退出全屏图片模式
      function exitFullscreen() {
        fullscreenOverlay.classList.remove('active');
        // 恢复滚动
        document.body.style.overflow = '';
        document.body.style.touchAction = '';
        // 可选: 清空图片src以释放内存 (但不强制)
        // 但为了下次快速显示，保留src也无妨
      }

      // ---------- 核心验证逻辑 ----------
      function handleView() {
        const inputPassword = passwordInput.value.trim();

        // 如果密码为空，提示但不报错（引导用户）
        if (inputPassword === '') {
          showError(true);
          // 自定义错误文案
          errorMsg.textContent = '⚠️ 请输入密码';
          return;
        }

        // 验证密码
        if (inputPassword === CORRECT_PASSWORD) {
          // 正确: 清除错误，进入全屏
          clearErrorState();
          // 使用用户定义的 base64 (若占位符为空则提示)
          const imageData = BASE64_IMAGE_PLACEHOLDER;
          enterFullscreen(imageData);
          // 可清空密码框 (可选) — 不清空，保留以便下次查看
          // passwordInput.value = ''; 
        } else {
          // 错误: 显示错误信息
          errorMsg.textContent = '❌ 密码错误，请重试';
          showError(true);
          // 抖动输入框 (轻微反馈)
          passwordInput.style.borderColor = '#ff6b70';
          setTimeout(() => {
            passwordInput.style.borderColor = '';
          }, 600);
          // 清空输入框 (方便重新输入)
          passwordInput.value = '';
          passwordInput.focus();
        }
      }

      // ---------- 事件绑定 ----------
      // 查看按钮点击
      viewButton.addEventListener('click', function(e) {
        e.preventDefault();
        handleView();
      });

      // 回车键在输入框内触发查看
      passwordInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleView();
        }
      });

      // 当输入框获得焦点时，清除错误状态 (提升体验)
      passwordInput.addEventListener('focus', function() {
        clearErrorState();
        passwordInput.style.borderColor = '';
      });

      // 全屏关闭按钮
      closeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        exitFullscreen();
      });

      // 点击遮罩背景 (非图片区域) 也可关闭 —— 但为防误触，仅点击关闭按钮才关闭。
      // 但也可以增加点击背景关闭: 判断点击的是遮罩本身还是图片容器
      fullscreenOverlay.addEventListener('click', function(e) {
        // 如果点击的是遮罩层本身（背景），而不是图片容器或关闭按钮，则关闭。
        if (e.target === fullscreenOverlay) {
          exitFullscreen();
        }
      });

      // 监听 ESC 键退出全屏
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && fullscreenOverlay.classList.contains('active')) {
          exitFullscreen();
        }
      });

      // 移动端 触摸背景退出 (如果点击的是遮罩)
      // 但是通过click已经处理，touch事件兼容，但click在移动端正常。

      // 额外: 若用户旋转屏幕或resize，图片自动适应 (无需额外操作)

      // 暴露关闭方法到全局 (调试用)
      window.exitFullscreen = exitFullscreen;

      // 但不强制
