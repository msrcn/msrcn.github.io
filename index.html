<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHA-256 加盐计算器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;font-family:Arial,"Microsoft YaHei",sans-serif;color:#1f2937}
.container{width:min(720px,92%);margin:70px auto;background:#fff;padding:32px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{margin:0 0 8px;font-size:24px}
.desc{color:#6b7280;margin-bottom:28px}
label{display:block;font-weight:600;margin:18px 0 8px}
input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:9px;font-size:15px;outline:none}
input:focus{border-color:#6366f1}
button{margin-top:24px;width:100%;padding:13px;border:0;border-radius:9px;background:#4f46e5;color:white;font-size:16px;cursor:pointer}
button:hover{background:#4338ca}
.result{margin-top:24px}
.result textarea{width:100%;height:105px;padding:13px;border:1px solid #d1d5db;border-radius:9px;font-family:Consolas,monospace;font-size:14px;resize:none}
.error{color:#dc2626;margin-top:12px}
.rule{margin-top:24px;padding:14px;background:#f3f4f6;border-radius:9px;font-family:Consolas,monospace;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<div class="container">
  <h1>SHA-256 加盐计算器</h1>
  <div class="desc">与 Java PasswordUtils.hashPassword() 规则保持一致</div>

  <label for="password">Password</label>
  <input id="password" type="password" placeholder="例如：Zjps@1163">

  <label for="salt">Salt（Base64）</label>
  <input id="salt" type="text" placeholder="例如：ADnPGbeRjqGSe02NEeXYHA==">

  <button onclick="calculate()">计算 SHA-256</button>

  <div class="result">
    <label for="result">Hash</label>
    <textarea id="result" readonly placeholder="计算结果"></textarea>
  </div>

  <div id="error" class="error"></div>

  <div class="rule">
    SHA-256(Base64Decode(salt) + UTF-8(password))
  </div>
</div>

<script>
function base64ToBytes(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

async function calculate() {
  const password = document.getElementById("password").value;
  const salt = document.getElementById("salt").value.trim();
  const result = document.getElementById("result");
  const error = document.getElementById("error");

  result.value = "";
  error.textContent = "";

  if (!password) {
    error.textContent = "请输入 Password";
    return;
  }

  if (!salt) {
    error.textContent = "请输入 Base64 Salt";
    return;
  }

  try {
    // 与 Java Base64.getDecoder().decode(salt) 一致
    const saltBytes = base64ToBytes(salt);

    // 与 Java password.getBytes(StandardCharsets.UTF_8) 一致
    const passwordBytes = new TextEncoder().encode(password);

    // saltBytes + passwordBytes
    const combined = new Uint8Array(
      saltBytes.length + passwordBytes.length
    );
    combined.set(saltBytes, 0);
    combined.set(passwordBytes, saltBytes.length);

    // SHA-256
    const hashBuffer = await crypto.subtle.digest("SHA-256", combined);
    const hashBytes = new Uint8Array(hashBuffer);

    // 转成小写十六进制，与 Java String.format("%02x", b) 一致
    const hash = Array.from(hashBytes)
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");

    result.value = hash;
  } catch (e) {
    error.textContent = "计算失败：Salt 不是有效的 Base64 字符串";
  }
}
</script>
</body>
</html>
